# Cross-compiling for the Raspberry Pi (64-bit) from an amd64 Debian/Ubuntu host:
#
#   sudo packaging/ci/install-arm64-cross-deps.sh     # aarch64 GCC + libasound2-dev:arm64
#   rustup target add aarch64-unknown-linux-gnu
#   cargo build --target aarch64-unknown-linux-gnu -p pixelplus-daemon
#
# Everything here is scoped to that target (pkg-config reads the `_<target>` variables), so
# native builds are unaffected, and values already set in the environment (CI, `cross`,
# packaging/build-deb.sh) win.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[env]
CC_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-gcc"
AR_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-ar"
# alsa-sys (cpal, the daemon's default "audio" feature) finds the arm64 ALSA headers here.
PKG_CONFIG_ALLOW_CROSS_aarch64_unknown_linux_gnu = "1"
PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu = "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
