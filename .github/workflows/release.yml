name: Release

# Push a tag like v1.2.3 (or run manually with a version) to build everything and
# publish a GitHub release:
#   pixelplus_<ver>_arm64.deb, pixelplus_<ver>_amd64.deb
#   pixelplus-<ver>-trixie-arm64.img.xz (+ bookworm), .sha256
#   pixelplus-imager.json   <- Raspberry Pi Imager repository (custom URL:
#       https://github.com/<owner>/PixelPlus/releases/latest/download/pixelplus-imager.json)
#   PixelPlus Imager installers (Windows .msi/.exe, macOS .dmg, Linux .AppImage/.deb/.rpm)
#   ghcr.io/<owner>/pixelplus:<ver> and :latest (linux/amd64 + linux/arm64)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          tag="${VERSION#v}"
          # Pre-release tags (v1.3.0-beta1) become Debian versions that sort BEFORE the
          # release (1.3.0~beta1) and are published on the beta channel only.
          v="${tag/-/\~}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"

  deb:
    name: .deb (${{ matrix.arch }})
    needs: meta
    runs-on: ubuntu-22.04   # oldest glibc we support building on (binaries run on Bookworm+)
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-${{ matrix.arch }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends device-tree-compiler pkg-config libasound2-dev libssl-dev libdbus-1-dev
      - name: arm64 cross toolchain + ALSA headers (cpal)
        if: matrix.arch == 'arm64'
        run: sudo packaging/ci/install-arm64-cross-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: packaging/build-deb.sh --arch ${{ matrix.arch }} --version ${{ needs.meta.outputs.version }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # Signed over-the-air updates (docs/BUILDING.md "Signed updates"): every .deb gets a
  # minisign signature, and a signed release index per channel (pixelplus-<channel>.json)
  # lists them. Needs the repository secrets MINISIGN_SECRET_KEY (the contents of the
  # password-protected minisign.key made with `minisign -G`) and MINISIGN_PASSWORD; the
  # public key is in packaging/keys/pixelplus-release.pub. Without them the release is
  # built unsigned and controllers won't offer it as an update (apt still works).
  sign:
    name: Sign packages and release index
    needs: [meta, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set: this release is not signed for over-the-air updates"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$key"
          trap 'rm -f "$key"' EXIT
          sign() { printf '%s\n' "${MINISIGN_PASSWORD}" | minisign -S -s "$key" -m "$1" -t "pixelplus $VERSION $(basename "$1")"; }
          for d in dist/*.deb; do sign "$d"; done
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md" || true
          channels="beta"
          case "$VERSION" in *"~"*) ;; *) channels="stable beta" ;; esac
          for ch in $channels; do
            python3 packaging/release-index.py --channel "$ch" --version "$VERSION" \
              --base-url "$base" --notes-file "$RUNNER_TEMP/notes.md" \
              --out "dist/pixelplus-$ch.json" dist/*.deb
            sign "dist/pixelplus-$ch.json"
          done
          # Every signature must verify with the key the daemon is built with.
          grep '^RW' packaging/keys/pixelplus-release.pub > "$RUNNER_TEMP/release.pub.b64" || {
            echo "::error::packaging/keys/pixelplus-release.pub has no key"; exit 1; }
          for f in dist/*.deb dist/pixelplus-*.json; do
            minisign -V -q -P "$(head -n1 "$RUNNER_TEMP/release.pub.b64")" -m "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            dist/*.minisig
            dist/pixelplus-*.json
          if-no-files-found: ignore

  image:
    name: SD image (${{ matrix.release }})
    needs: [meta, deb]
    # Native arm64 runner: pi-gen chroots without qemu (~3x faster). pi-gen needs a
    # privileged container with loop devices, which GitHub-hosted runners allow.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        release: [trixie, bookworm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: dist
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Build image (pi-gen in Docker)
        env:
          PIXELPLUS_IMAGE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
        run: |
          image/build-in-docker.sh --release ${{ matrix.release }} \
            --deb dist/pixelplus_${{ needs.meta.outputs.version }}_arm64.deb \
            --version ${{ needs.meta.outputs.version }} --out deploy
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.release }}
          path: |
            deploy/*.img.xz
            deploy/*.sha256
            deploy/*.info
            deploy/os-list-*.json
          compression-level: 0

  docker:
    name: Docker image
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pixelplus" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  imager:
    name: PixelPlus Imager (${{ matrix.platform }})
    needs: [meta, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: imager
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: imager/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: imager
      - name: Set version
        shell: bash
        run: |
          v='${{ needs.meta.outputs.version }}'
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" imager/src-tauri/tauri.conf.json
      # Code signing (optional): set APPLE_* / TAURI_SIGNING_* / WINDOWS certificate secrets;
      # unsigned builds work but show OS warnings (see docs/BUILDING.md).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: imager
          tauriScript: pnpm tauri
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

  release:
    name: GitHub release
    needs: [meta, deb, image, sign]
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Raspberry Pi Imager repository JSON
        run: |
          python3 image/rpi-imager/make-os-list.py --merge artifacts/image-*/os-list-*.json \
            --out artifacts/pixelplus-imager.json
      - id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: PixelPlus ${{ needs.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.meta.outputs.version, '~') }}
          files: |
            artifacts/deb-*/*.deb
            artifacts/signatures/*
            artifacts/image-*/*.img.xz
            artifacts/image-*/*.sha256
            artifacts/pixelplus-imager.json
