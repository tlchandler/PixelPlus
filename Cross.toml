# `cross build --target aarch64-unknown-linux-gnu` (packaging/build-deb.sh, option 1):
# the daemon's audio output (cpal, feature "audio") needs the arm64 ALSA headers.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libasound2-dev:$CROSS_DEB_ARCH",
]
