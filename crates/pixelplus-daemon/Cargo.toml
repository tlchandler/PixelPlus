[package]
name = "pixelplus-daemon"
description = "PixelPlus show daemon: API, playback, scheduling, cluster sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "pixelplusd"
path = "src/main.rs"

[dependencies]
pixelplus-core.workspace = true
pixelplus-output.workspace = true
pixelplus-hw.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
rand.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "cors", "set-header"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
bytes = "1"
argon2 = "0.5"
parking_lot = "0.12"
# --- system/content/services workstream
png = "0.17"
tar = "0.4"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
rumqttc = { version = "0.24", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "isomp4", "aac"] }
ebur128 = "0.1"
chrono-tz = "0.10"
libc = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
# --- cluster workstream
sha2 = "0.10"
# X25519 key agreement at adoption (already in the tree via rustls)
ring = "0.17"
if-addrs = "0.15"
mdns-sd = "0.21"
# --- playback engine workstream
cpal = { version = "0.15", optional = true }
rubato = "0.16"
# --- feature wave (added by WS0 so workstreams need not edit this file)
# F1 local CA + leaf certificates (ring backend, no aws-lc / cmake)
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# F1 HTTPS listener (implement axum::serve::Listener over TlsAcceptor)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# F15 minisign (Ed25519) signatures on .deb files
minisign-verify = "0.2"
# F10 encrypted controller transfer file (AES-256-GCM; key via argon2)
aes-gcm = "0.10"

[features]
default = ["audio"]
# ALSA audio output through cpal (needs libasound2-dev to build). Without it the
# player runs lights-only on its monotonic clock.
audio = ["dep:cpal"]
