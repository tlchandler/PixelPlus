; PixelPlus ESP32 sensor node (F20). See README.md.
;
;   pio run -e esp32c3            build for an ESP32-C3 DevKitM-1 (recommended)
;   pio run -e esp32c3 -t upload  flash it over USB
;   pio test -e native            protocol + debounce unit tests on this PC

[platformio]
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -std=gnu++17
  -DPP_FW_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11

; Arduino-ESP32 3.x (ESP-IDF 5) via the pioarduino platform; the stock
; espressif32 platform (Arduino-ESP32 2.x) works too (see `esp32dev-classic`).
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board_build.partitions = min_spiffs.csv

[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DPP_BOARD_C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPP_BOARD_S3

[env:esp32dev]
extends = esp32_common
board = esp32dev
build_flags = ${env.build_flags} -DPP_BOARD_ESP32

; Classic ESP32 DevKit on the registry platform (Arduino-ESP32 2.x).
[env:esp32dev-classic]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DPP_BOARD_ESP32

; Host unit tests (no hardware): test/test_protocol, test/test_debounce.
[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
