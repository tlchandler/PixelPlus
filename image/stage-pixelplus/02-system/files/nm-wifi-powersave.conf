# PixelPlus: Wi-Fi power saving off for every connection (also ones made with
# Raspberry Pi Imager or nmcli). With power saving on, the access point holds
# packets for a dozing controller until its next wake-up: 50-1000 ms delays
# that break the timing between controllers. 2 = disable.
# (Fallback: pixelplus-firstboot / pixelplus-netwatch run `iw dev wlan0 set
# power_save off`; the PixelPlus health check warns if it is still on.)
[connection]
wifi.powersave = 2
