# PixelPlus Imager - its own Cargo workspace (kept out of the root workspace so the
# daemon build never needs WebKit/GTK). Build: see docs/BUILDING.md.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tlchandler/PixelPlus"
authors = ["PixelPlus contributors"]
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decompression/hashing are unbearably slow unoptimised (tests stream several MB).
[profile.dev.package."*"]
opt-level = 2
