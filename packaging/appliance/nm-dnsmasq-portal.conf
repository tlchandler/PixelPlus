# PixelPlus setup hotspot (NetworkManager "shared" mode dnsmasq only).
# Answer every DNS query with the Pi so phones find the setup page ...
address=/#/10.42.0.1
# ... and tell modern phones where the captive portal is (RFC 8910, DHCP option 114).
dhcp-option=114,http://10.42.0.1/
# Short leases: phones come and go during setup.
dhcp-lease-max=32
