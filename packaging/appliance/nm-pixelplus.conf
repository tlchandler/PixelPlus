# PixelPlus appliance defaults for NetworkManager.
[connection]
# Wi-Fi power saving adds 50-1000 ms latency spikes that break show sync
# (clock probes and sync packets wait at the access point for the controller
# to wake up). 2 = disable. PixelPlus also turns it off with `iw` at boot
# (firstboot, netwatch) and its health check warns when it is on.
wifi.powersave=2

[device]
# Do not let MAC randomisation change the controller's identity between scans.
wifi.scan-rand-mac-address=no
