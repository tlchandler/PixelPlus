# /run/pixelplus: shared runtime dir, owned by the service user (games.sock control socket,
# netwatch.json status, helper-<verb>.json progress). Root writers (netwatch, pixelplus-helper)
# never write through paths in it directly: they create files elsewhere / exclusively and rename.
d /run/pixelplus 0775 pixelplus pixelplus -
# private scratch dir of the root helper
d /run/pixelplus-helper 0700 root root -
d /var/lib/pixelplus 0750 pixelplus pixelplus -
# Sidecars run as their own users (docs/BUILDING.md "Security model"): games/ is shared
# by pixelplusd (uploads ROMs) and pixelplus-games (setgid: new files keep the group),
# tts/ belongs to pixelplus-tts.
d /var/lib/pixelplus/games 2770 pixelplus pixelplus-overlay -
d /var/lib/pixelplus/games/roms 2770 pixelplus pixelplus-overlay -
d /var/lib/pixelplus/tts 0750 pixelplus-tts pixelplus-tts -
# Signed updates (F15): staged and kept (rollback) packages and the pending-update
# marker belong to the root helper only; pixelplusd hands packages over through
# /var/lib/pixelplus/updates/incoming (its own) and the helper re-verifies them.
d /var/cache/pixelplus 0755 root root -
d /var/cache/pixelplus/staged 0700 root root -
d /var/cache/pixelplus/rollback 0700 root root -
d /var/lib/pixelplus-helper 0700 root root -
