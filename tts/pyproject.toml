[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelplus-tts"
dynamic = ["version"]
description = "PixelPlus DJ voices: Kokoro TTS sidecar with voice blends, energy/hype prosody and radio processing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "kokoro-onnx>=0.4.9,<0.7",
  "onnxruntime>=1.17",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Praat PSOLA energy/hype prosody. No Linux aarch64 wheels exist (Raspberry Pi): there the
# built-in fallback (pixelplus_tts/prosody.py) is used instead.
psola = ["praat-parselmouth>=0.4.3"]
# bundled ffmpeg for systems without one (Windows/Mac dev); Pi OS and Docker use apt's ffmpeg
bundled-ffmpeg = ["imageio-ffmpeg>=0.4.9"]

[project.scripts]
pixelplus-tts = "pixelplus_tts.__main__:main"

[tool.setuptools]
packages = ["pixelplus_tts"]

[tool.setuptools.dynamic]
version = { attr = "pixelplus_tts.__version__" }

[tool.setuptools.package-data]
pixelplus_tts = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the package lives next to tests/ (not installed): works from tts/ and from the repo root (CI)
pythonpath = ["."]
